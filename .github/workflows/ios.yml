name: iOS build + simulator screenshot
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild -project Demo.xcodeproj -scheme Demo \
            -sdk iphonesimulator -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build build | tail -25

      - name: Build device .app (unsigned)
        run: |
          xcodebuild -project Demo.xcodeproj -scheme Demo \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build-device build | tail -15

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/Demo.app Payload/
          zip -qry Demo-unsigned.ipa Payload
          ls -la Demo-unsigned.ipa

      - name: Boot simulator, install, launch, screenshot
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 "iPhone 16 (" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device=$DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/Demo.app
          xcrun simctl launch "$DEV" id.kahiyang.demo
          sleep 6
          xcrun simctl io "$DEV" screenshot screenshot.png
          ls -la screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            screenshot.png
            Demo-unsigned.ipa
          retention-days: 7
