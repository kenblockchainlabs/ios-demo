name: Demo
options:
  bundleIdPrefix: id.kahiyang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Demo:
    type: application
    platform: iOS
    sources: [Demo]
    info:
      path: Demo/Info.plist
      properties:
        CFBundleDisplayName: FreeMilk client
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSExceptionDomains:
            "89.144.42.210":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.kahiyang.demo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
